# ========================================================
# MoonOrbit - Nginx Reverse Proxy Configuration Template
# ========================================================
# Replace 'orbit.tu-dominio.com' with your actual domain or VPS IP.

# Rate limiting zone (optional, protects against DDoS)
limit_req_zone $binary_remote_addr zone=moonorbit_limit:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name orbit.tu-dominio.com;

    # Redirect all HTTP requests to HTTPS (after Certbot SSL setup)
    # return 301 https://$host$request_uri;

    # For initial testing before SSL:
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket support (CRITICAL: without this, WS /ws fails)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forward real client headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for persistent WebSockets
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Max body size for avatar uploads (1 MB + headers)
        client_max_body_size 2M;
    }
}

