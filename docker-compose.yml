services:
  db:
    image: postgres:16-alpine
    container_name: moonorbit-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
      POSTGRES_DB: ${POSTGRES_DB:-moonorbit}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./moonorbit-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-moonorbit}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: moonorbit-api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-1234}@db:5432/${POSTGRES_DB:-moonorbit}
      DATABASE_SSL: "false"
      TRUST_PROXY: "true"
      AVATAR_ROOT: /app/avatars
    volumes:
      - avatars:/app/avatars
    ports:
      - "3000:3000"

volumes:
  pgdata:
  avatars:
